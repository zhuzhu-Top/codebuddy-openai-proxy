name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and compatibility impact.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Scope
      options:
        - label: This request does not require bypassing authentication or account controls.
          required: true
